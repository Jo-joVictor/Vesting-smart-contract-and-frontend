[profile.default]
evm_version = "cancun"
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
viaIR = true

fuzz = { runs = 256 }
invariant = { runs = 256, depth = 50 }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options